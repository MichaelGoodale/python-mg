[package]
name = "python-mg"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "python_mg"
crate-type = ["cdylib"]

[dependencies]
simple-semantics = { git = "https://github.com/MichaelGoodale/simple-semantics.git" }
pyo3 = { version = "0.29.2", features = [
  "anyhow",
  "extension-module",
  "generate-import-lib",
  "multiple-pymethods",
] }
minimalist-grammar-parser = { git = "https://@github.com/MichaelGoodale/minimalist-grammar-parser.git", features = [
  "pretty",
] }
anyhow = "1.0.98"
logprob = "0.4.0"
rand = "0.10.0"
numpy = "0.29.0"
itertools = "0.15.0"
